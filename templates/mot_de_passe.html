{% extends "base.html" %}
{% block titre %}Mot de passe{% endblock %}
{% block contenu %}
<section class="carte etroite">
  <h1>Changer de mot de passe</h1>
  {% if obligatoire %}
    <div class="alerte info">Première connexion : choisissez votre mot de passe personnel (8 caractères au moins).</div>
  {% endif %}
  <form method="post">
    <input type="hidden" name="jeton_csrf" value="{{ jeton_csrf }}">
    <label>Mot de passe actuel <input type="password" name="actuel" required autocomplete="current-password"></label>
    <label>Nouveau mot de passe <input type="password" name="nouveau" required minlength="8" autocomplete="new-password"></label>
    <label>Confirmation <input type="password" name="confirmation" required minlength="8" autocomplete="new-password"></label>
    <button type="submit">Enregistrer</button>
  </form>
</section>
{% endblock %}
